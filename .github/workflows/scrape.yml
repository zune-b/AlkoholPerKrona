name: Scrape beer prices

# Manual / on-demand only. The daily cron was removed at the user's
# request — to refresh prices, trigger this workflow from the Actions tab
# ("Run workflow") or push a change under scraper/ or data/candidates.json.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - "data/candidates.json"
      - ".github/workflows/scrape.yml"

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - run: python -m scraper.main

      - name: Discover new venues from candidates backlog
        run: python -m scraper.discovery

      - name: Record price history
        run: python -m scraper.history

      - name: Validate scraped data
        run: |
          set +e
          output=$(python -m scraper.validate 2>&1)
          status=$?
          echo "$output"
          {
            echo "### Scrape data health"
            echo '```'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Commit updated data
        run: |
          if [[ -z "$(git status --porcelain data/restaurants.json data/history.json)" ]]; then
            echo "No changes."
            exit 0
          fi
          git config user.name  "alkoholperkrona-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/restaurants.json data/history.json
          git commit -m "data: refresh beer prices ($(date -u +%Y-%m-%d))"
          # Rebase-and-retry up to 5 times to survive races with other
          # pushes (concurrent merges, parallel workflow runs).
          for attempt in 1 2 3 4 5; do
            if git push; then
              exit 0
            fi
            echo "push attempt $attempt rejected; rebasing on origin/main"
            git pull --rebase --autostash origin main
          done
          echo "give up after 5 push attempts"
          exit 1

      # Bot pushes don't fire push-triggered workflows (GitHub recursion
      # guard), so the site would keep serving old prices — dispatch the
      # Pages deploy explicitly instead.
      - name: Redeploy website with fresh data
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run pages.yml --ref main
