name: Scrape beer prices

on:
  schedule:
    # 04:17 UTC daily — off-peak, avoids the top of the hour
    - cron: "17 4 * * *"
  workflow_dispatch:

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - run: python -m scraper.main

      - name: Commit updated data
        run: |
          if [[ -n "$(git status --porcelain data/restaurants.json)" ]]; then
            git config user.name  "alkoholperkrona-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/restaurants.json
            git commit -m "data: refresh beer prices ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes."
          fi
