name: Scrape beer prices

on:
  schedule:
    # 04:17 UTC daily — off-peak, avoids the top of the hour
    - cron: "17 4 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "scraper/**"
      - ".github/workflows/scrape.yml"

concurrency:
  group: scrape
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/requirements.txt

      - run: pip install -r scraper/requirements.txt

      - run: python -m scraper.main

      - name: Discover new venues from candidates backlog
        run: python -m scraper.discovery

      - name: Validate scraped data
        run: |
          set +e
          output=$(python -m scraper.validate 2>&1)
          status=$?
          echo "$output"
          {
            echo "### Scrape data health"
            echo '```'
            echo "$output"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

      - name: Commit updated data
        run: |
          if [[ -n "$(git status --porcelain data/restaurants.json)" ]]; then
            git config user.name  "alkoholperkrona-bot"
            git config user.email "actions@users.noreply.github.com"
            git add data/restaurants.json
            git commit -m "data: refresh beer prices ($(date -u +%Y-%m-%d))"
            git push
          else
            echo "No changes."
          fi
