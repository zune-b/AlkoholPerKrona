name: Deploy website

on:
  push:
    branches: [main]
    paths:
      - "site/**"
      - "data/restaurants.json"
      - "data/happy_hours.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Assemble site with fresh price data
        run: |
          mkdir dist
          cp -r site/. dist/
          cp data/restaurants.json dist/restaurants.json
          cp data/history.json dist/history.json
          cp data/happy_hours.json dist/happy_hours.json

      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

      - id: deployment
        uses: actions/deploy-pages@v4
